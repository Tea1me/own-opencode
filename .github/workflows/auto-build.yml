name: Auto Build & Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.TAG }}
    steps:
      - name: 获取官方最新版本
        id: get-tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          for i in {1..3}; do
            TAG=$(curl -fsSL --retry 3 https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name')
            if [ "$TAG" != "null" ] && [ -n "$TAG" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "❌ 无法获取官方最新版本" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "✅ 官方最新版本: $TAG"

  build:
    needs: get-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            type: normal
          - os: linux
            arch: x86_64
            type: musl
          - os: linux
            arch: arm64
            type: normal
          - os: linux
            arch: arm64
            type: musl
          - os: windows
            arch: x64
            type: modern

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y wget jq unzip

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.type }}" = "modern" ]; then
            chmod +x build/windows-modern-portable.sh
            ./build/windows-modern-portable.sh '${{ needs.get-version.outputs.tag }}'
          else
            chmod +x build/build.sh
            ./build/build.sh '${{ needs.get-version.outputs.tag }}' '${{ matrix.arch }}' '${{ matrix.type }}'
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.type }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  validate-windows-modern:
    needs: [get-version, build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 下载 Windows modern 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-modern-x64
          path: artifact

      - name: 解压
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw 'windows modern artifact missing' }
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          tar -xzf $archive.FullName -C unpacked

      - name: 验证编译引擎与 portable 启动器
        shell: pwsh
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          $exe = Join-Path $root 'bin/opencode.exe'
          if (-not (Test-Path $exe)) { throw 'bin/opencode.exe missing' }

          $expected = '${{ needs.get-version.outputs.tag }}'.TrimStart('v')
          $actual = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'compiled opencode --version failed' }
          if ($actual -ne $expected) { throw "expected $expected, got $actual" }

          $bat = Get-Content (Join-Path $root 'opencode.bat') -Raw
          foreach ($needle in @(
            'OPENCODE_CONFIG_DIR=',
            'OPENCODE_DB=%PORTABLE%\data\opencode.db',
            'XDG_CONFIG_HOME=',
            'XDG_DATA_HOME=',
            'XDG_CACHE_HOME=',
            'XDG_STATE_HOME=',
            'TEMP=%PORTABLE%',
            'TMP=%PORTABLE%',
            'OPENCODE_DISABLE_AUTOUPDATE=1',
            'bin\opencode.exe'
          )) {
            if ($bat -notmatch [regex]::Escape($needle)) { throw "launcher missing: $needle" }
          }

      - name: 验证 CLI 与 portable 路径
        shell: pwsh
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          Push-Location $root
          try {
            cmd /d /c "opencode.bat --version"
            if ($LASTEXITCODE -ne 0) { throw "opencode --version failed: $LASTEXITCODE" }

            cmd /d /c "opencode.bat --help > smoke-help.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-help.txt
              throw "opencode --help failed: $LASTEXITCODE"
            }

            cmd /d /c "opencode.bat debug paths > smoke-paths.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-paths.txt
              throw "opencode debug paths failed: $LASTEXITCODE"
            }
            $paths = Get-Content smoke-paths.txt -Raw
            Write-Host $paths

            $portable = (Resolve-Path 'portable-data').Path
            foreach ($part in @('config', 'data', 'cache', 'state', 'tmp')) {
              $expectedPath = Join-Path $portable $part
              if ($paths -notlike "*$expectedPath*") {
                throw "debug paths did not report portable $part path: $expectedPath"
              }
            }
          }
          finally {
            Pop-Location
          }

      - name: 安装 ConPTY 测试辅助工具
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pywinpty

      - name: Windows 真机交互 TUI smoke
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          root = os.path.abspath(r"unpacked\windows-modern")
          bat = os.path.join(root, "opencode.bat")
          proc = PtyProcess.spawn(["cmd.exe", "/d", "/c", bat], cwd=root, dimensions=(120, 40))
          chunks = []

          def reader():
              try:
                  while proc.isalive():
                      data = proc.read(4096)
                      if data:
                          chunks.append(data)
              except (EOFError, OSError):
                  pass

          thread = threading.Thread(target=reader, daemon=True)
          thread.start()
          time.sleep(12)
          alive = proc.isalive()

          if alive:
              try:
                  proc.write("\x03")
              except Exception:
                  pass
              time.sleep(1)
          if proc.isalive():
              proc.terminate(force=True)
          thread.join(timeout=2)

          output = "".join(chunks)
          clean = re.sub(r"\x1b\][^\x07]*(?:\x07|\x1b\\)", "", output)
          clean = re.sub(r"\x1bP.*?\x1b\\", "", clean, flags=re.S)
          clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", clean)
          clean = "".join(ch for ch in clean if ch in "\r\n\t" or ord(ch) >= 32)
          printable = clean.strip()

          print(repr(output[:16000]))
          print(printable[:12000])
          print(f"printable chars={len(printable)} alive_after_12s={alive}")

          lower = output.lower()
          for marker in ("module not found", "cannot find module", "unexpected error", "syntaxerror", "referenceerror"):
              if marker in lower:
                  raise SystemExit(f"TUI emitted fatal marker: {marker}")
          if len(printable) < 80:
              raise SystemExit("interactive TUI did not render enough printable terminal content")
          '@ | Set-Content -Encoding UTF8 tui_smoke.py
          python tui_smoke.py

  release:
    needs: [get-version, build, validate-windows-modern]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -lh dist/

      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}-portable
          name: OpenCode ${{ needs.get-version.outputs.tag }} (Portable)
          body: |
            🚀 便携版
            - Linux x64/arm64 (glibc/musl)
            - Windows x64 modern (Windows 10+，官方编译 CLI + portable 启动器)
            - Windows 配置、数据、缓存、状态与临时文件重定向到 portable-data
            - Windows 包发布前会在 windows-latest 的 ConPTY 中执行无参数 TUI 真启动验证
            - OpenCode 自更新已关闭，版本更新由本仓库 Release 流程统一管理
          files: dist/*.tar.gz
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
