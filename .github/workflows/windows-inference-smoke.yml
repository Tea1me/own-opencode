name: Windows Portable Inference Smoke

on:
  push:
    branches: [main]
    paths:
      - 'build/windows-modern-portable.sh'
      - '.github/workflows/windows-inference-smoke.yml'
      - '.github/workflows/windows-portable-smoke.yml'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget jq unzip

      - name: Resolve latest OpenCode release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)
          test -n "$tag" && test "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using OpenCode $tag"

      - name: Build strict Windows portable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/windows-modern-portable.sh
          ./build/windows-modern-portable.sh '${{ steps.version.outputs.tag }}'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-inference-smoke
          path: dist/opencode-${{ steps.version.outputs.tag }}-portable-windows-modern-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  inference:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-inference-smoke
          path: artifact

      - name: Extract
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw 'portable archive missing' }
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          tar -xzf $archive.FullName -C unpacked

      - name: End-to-end default free-model inference
        shell: pwsh
        run: |
          $root = (Resolve-Path 'unpacked/windows-modern').Path
          $bat = Join-Path $root 'opencode.bat'
          $portable = Join-Path $root 'portable-data'
          $configFile = Join-Path $portable 'config\opencode\opencode.jsonc'
          $project = Join-Path $PWD 'inference-project'
          New-Item -ItemType Directory -Force -Path $project | Out-Null

          # Start from a clean anonymous/default-model state. Do not specify --model.
          @'
          {
            "$schema": "https://opencode.ai/config.json"
          }
          '@ | Set-Content -Encoding UTF8 $configFile

          Push-Location $project
          try {
            # When signed out, the OpenCode provider only exposes zero-cost models.
            cmd /d /c "`"$bat`" models opencode > free-models.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content free-models.txt
              throw "listing anonymous opencode models failed: $LASTEXITCODE"
            }
            $models = Get-Content free-models.txt | Where-Object { $_ -match '^opencode/' }
            Write-Host 'Anonymous OpenCode models:'
            $models | ForEach-Object { Write-Host "  $_" }
            if (-not $models -or $models.Count -lt 1) {
              throw 'no anonymous OpenCode model is available'
            }

            # Do not pass --model: exercise OpenCode's real default model selection.
            # 99101 is not present in the prompt, so an input echo cannot satisfy the assertion.
            @"
          @echo off
          call "$bat" run "Compute 41837 + 57264. Reply with only the integer result." --format json
          "@ | Set-Content -Encoding ASCII e2e.cmd

            $stdout = Join-Path $project 'inference-stdout.txt'
            $stderr = Join-Path $project 'inference-stderr.txt'
            $proc = Start-Process -FilePath 'cmd.exe' `
              -ArgumentList @('/d', '/c', 'e2e.cmd') `
              -WorkingDirectory $project `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            if (-not $proc.WaitForExit(180000)) {
              try { $proc.Kill($true) } catch {}
              throw 'default-model inference timed out after 180 seconds'
            }
            $proc.WaitForExit()

            $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            Write-Host '--- inference stdout ---'
            Write-Host $out
            Write-Host '--- inference stderr ---'
            Write-Host $err
            Write-Host "exit=$($proc.ExitCode)"

            if ($proc.ExitCode -ne 0) {
              throw "default-model inference failed with exit code $($proc.ExitCode)"
            }
            if ($out -notmatch '99101') {
              throw 'model did not return the expected inference result 99101'
            }

            $db = Join-Path $portable 'data\opencode\opencode.db'
            if (-not (Test-Path $db)) {
              throw "inference did not create the portable database: $db"
            }
          }
          finally {
            Pop-Location
          }

      - name: Install ConPTY test helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pywinpty

      - name: End-to-end message submission through TUI
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          root = os.path.abspath(r"unpacked\windows-modern")
          project = os.path.abspath(r"inference-project")
          bat = os.path.join(root, "opencode.bat")
          prompt = "Compute 41837 + 57264. Reply with only the integer result."
          expected = "99101"

          # Config remains anonymous and has no explicit model. The TUI must use
          # the same built-in default/free-model selection as a real first run.
          proc = PtyProcess.spawn(["cmd.exe", "/d", "/c", bat], cwd=project, dimensions=(120, 40))
          chunks = []
          lock = threading.Lock()

          def reader():
              try:
                  while proc.isalive():
                      data = proc.read(4096)
                      if data:
                          with lock:
                              chunks.append(data)
              except (EOFError, OSError):
                  pass

          thread = threading.Thread(target=reader, daemon=True)
          thread.start()

          # Give OpenTUI time to enter the alternate screen and focus the prompt.
          time.sleep(6)
          if not proc.isalive():
              raise SystemExit("TUI exited before accepting a message")

          proc.write(prompt)
          proc.write("\r")

          deadline = time.time() + 90
          found = False
          while time.time() < deadline:
              with lock:
                  output = "".join(chunks)
              if expected in output:
                  found = True
                  break
              if not proc.isalive():
                  break
              time.sleep(0.5)

          with lock:
              output = "".join(chunks)

          clean = re.sub(r"\x1b\][^\x07]*(?:\x07|\x1b\\)", "", output)
          clean = re.sub(r"\x1bP.*?\x1b\\", "", clean, flags=re.S)
          clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", clean)
          clean = "".join(ch for ch in clean if ch in "\r\n\t" or ord(ch) >= 32)
          print(clean[-20000:])
          print(f"expected_found={found} alive={proc.isalive()} raw_chars={len(output)}")

          if proc.isalive():
              try:
                  proc.write("\x03")
              except Exception:
                  pass
              time.sleep(1)
          if proc.isalive():
              proc.terminate(force=True)
          thread.join(timeout=2)

          lower = output.lower()
          for marker in ("module not found", "cannot find module", "unexpected error", "syntaxerror", "referenceerror"):
              if marker in lower:
                  raise SystemExit(f"TUI emitted fatal marker: {marker}")
          if not found:
              raise SystemExit("TUI accepted the test message but no model reply containing 99101 arrived within 90 seconds")
          '@ | Set-Content -Encoding UTF8 tui_inference_smoke.py
          python tui_inference_smoke.py
