name: Windows Portable Smoke

on:
  push:
    branches: [main]
    paths:
      - 'build/windows-modern-portable.sh'
      - '.github/workflows/windows-portable-smoke.yml'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget jq unzip

      - name: Resolve latest OpenCode release
        id: version
        shell: bash
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)
          test -n "$tag" && test "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using OpenCode $tag"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build Windows modern portable
        shell: bash
        run: |
          chmod +x build/windows-modern-portable.sh
          ./build/windows-modern-portable.sh '${{ steps.version.outputs.tag }}'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-modern-smoke
          path: dist/opencode-${{ steps.version.outputs.tag }}-portable-windows-modern-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-modern-smoke
          path: artifact

      - name: Extract
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw 'portable archive missing' }
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          tar -xzf $archive.FullName -C unpacked

      - name: Verify bundled runtime and offline launcher
        shell: pwsh
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          $bun = Join-Path $root 'runtime/bun/bun.exe'
          if (-not (Test-Path $bun)) { throw 'bundled bun.exe missing' }
          $v = & $bun --version
          if ($LASTEXITCODE -ne 0) { throw 'bun --version failed' }
          if ($v.Trim() -ne '1.3.14') { throw "expected Bun 1.3.14, got $v" }
          $bat = Get-Content (Join-Path $root 'opencode.bat') -Raw
          if ($bat -notmatch '--no-install') { throw 'launcher does not contain --no-install' }
          if ($bat -notmatch 'OPENCODE_DISABLE_AUTOUPDATE=1') { throw 'launcher does not disable OpenCode auto-update' }
          $tui = Get-Content (Join-Path $root 'packages/opencode/src/cli/cmd/tui.ts') -Raw
          if ($tui -notmatch 'process\.platform === "win32"') { throw 'Windows HTTP transport patch missing' }

      - name: Smoke test CLI without auto-update
        shell: pwsh
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          Push-Location $root
          try {
            cmd /d /c "opencode.bat --version"
            if ($LASTEXITCODE -ne 0) { throw "opencode --version failed with $LASTEXITCODE" }
            cmd /d /c "opencode.bat --help > smoke-help.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-help.txt
              throw "opencode --help failed with $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Install ConPTY test helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pywinpty

      - name: Compare interactive TUI startup modes in ConPTY
        shell: pwsh
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          OPENCODE_PURE: '1'
        run: |
          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          root = os.path.abspath(r"unpacked\windows-modern")
          bat = os.path.join(root, "opencode.bat")

          def run_case(label, extra_args):
              argv = ["cmd.exe", "/d", "/c", bat, *extra_args]
              print(f"===== CASE {label}: {argv!r} =====")
              proc = PtyProcess.spawn(argv, cwd=root, dimensions=(120, 40))
              chunks = []

              def reader():
                  try:
                      while proc.isalive():
                          data = proc.read(4096)
                          if data:
                              chunks.append(data)
                  except (EOFError, OSError):
                      pass

              thread = threading.Thread(target=reader, daemon=True)
              thread.start()
              time.sleep(12)

              alive_after_12s = proc.isalive()
              if alive_after_12s:
                  try:
                      proc.write("\x03")
                  except Exception:
                      pass
                  time.sleep(1)
              if proc.isalive():
                  proc.terminate(force=True)
              thread.join(timeout=2)

              output = "".join(chunks)
              print(f"----- {label} raw output (first 16000 chars) -----")
              print(repr(output[:16000]))

              clean = re.sub(r"\x1b\][^\x07]*(?:\x07|\x1b\\)", "", output)
              clean = re.sub(r"\x1bP.*?\x1b\\", "", clean, flags=re.S)
              clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", clean)
              clean = "".join(ch for ch in clean if ch in "\r\n\t" or ord(ch) >= 32)
              printable = clean.strip()
              print(f"----- {label} printable output -----")
              print(printable[:12000])
              print(f"{label}: printable chars={len(printable)}, alive_after_12s={alive_after_12s}")
              return output, printable

          default_raw, default_text = run_case("default", [])
          port_raw, port_text = run_case("explicit-port", ["--port", "4521"])

          fatal_markers = [
              "module not found",
              "cannot find module",
              "unexpected error",
              "syntaxerror",
              "referenceerror",
              "typeerror:",
          ]
          for label, output in (("default", default_raw), ("explicit-port", port_raw)):
              lower = output.lower()
              for marker in fatal_markers:
                  if marker in lower:
                      raise SystemExit(f"{label} TUI emitted fatal marker: {marker}")

          print(f"SUMMARY default={len(default_text)} explicit-port={len(port_text)}")
          if len(port_text) < 80:
              raise SystemExit("explicit --port also failed to render TUI under ConPTY")
          if len(default_text) < 80:
              raise SystemExit("explicit --port renders but default startup is still blank")
          '@ | Set-Content -Encoding UTF8 conpty_compare.py
          python conpty_compare.py
