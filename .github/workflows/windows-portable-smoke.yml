name: Windows Portable Smoke

on:
  push:
    branches: [main]
    paths:
      - 'build/windows-modern-portable.sh'
      - '.github/workflows/windows-portable-smoke.yml'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget jq unzip

      - name: Resolve latest OpenCode release
        id: version
        shell: bash
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)
          test -n "$tag" && test "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using OpenCode $tag"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build Windows modern portable
        shell: bash
        run: |
          chmod +x build/windows-modern-portable.sh
          ./build/windows-modern-portable.sh '${{ steps.version.outputs.tag }}'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-modern-smoke
          path: dist/opencode-${{ steps.version.outputs.tag }}-portable-windows-modern-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-modern-smoke
          path: artifact

      - name: Extract
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw 'portable archive missing' }
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          tar -xzf $archive.FullName -C unpacked

      - name: Verify bundled runtime and offline launcher
        shell: pwsh
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          $bun = Join-Path $root 'runtime/bun/bun.exe'
          if (-not (Test-Path $bun)) { throw 'bundled bun.exe missing' }
          $v = & $bun --version
          if ($LASTEXITCODE -ne 0) { throw 'bun --version failed' }
          if ($v.Trim() -ne '1.3.14') { throw "expected Bun 1.3.14, got $v" }
          $bat = Get-Content (Join-Path $root 'opencode.bat') -Raw
          if ($bat -notmatch '--no-install') { throw 'launcher does not contain --no-install' }
          if ($bat -notmatch 'OPENCODE_DISABLE_AUTOUPDATE=1') { throw 'launcher does not disable OpenCode auto-update' }

      - name: Smoke test CLI commands
        shell: pwsh
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          Push-Location $root
          try {
            cmd /d /c "opencode.bat --version"
            if ($LASTEXITCODE -ne 0) { throw "opencode --version failed with $LASTEXITCODE" }
            cmd /d /c "opencode.bat --help > smoke-help.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-help.txt
              throw "opencode --help failed with $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Install ConPTY test helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pywinpty

      - name: Isolate OpenTUI renderer startup in ConPTY
        shell: pwsh
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          @'
          import { createCliRenderer } from "@opentui/core"

          console.error("[probe] before createCliRenderer")
          const renderer = await createCliRenderer({
            targetFps: 30,
            exitOnCtrlC: false,
            useAlternateScreen: false,
            useMouse: false,
          })
          console.error("[probe] after createCliRenderer")
          await Bun.sleep(1200)
          renderer.destroy()
          console.error("[probe] destroyed")
          process.exit(0)
          '@ | Set-Content -Encoding UTF8 (Join-Path $root 'opentui_probe.ts')

          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          root = os.path.abspath(r"unpacked\windows-modern")
          bun = os.path.join(root, "runtime", "bun", "bun.exe")
          probe = os.path.join(root, "opentui_probe.ts")

          def run_case(label, env_updates):
              print(f"===== OPENTUI PROBE {label} env={env_updates!r} =====")
              saved = {}
              for key, value in env_updates.items():
                  saved[key] = os.environ.get(key)
                  os.environ[key] = value
              try:
                  proc = PtyProcess.spawn([bun, "--no-install", probe], cwd=root, dimensions=(120, 40))
              finally:
                  for key, value in saved.items():
                      if value is None:
                          os.environ.pop(key, None)
                      else:
                          os.environ[key] = value

              chunks = []
              def reader():
                  try:
                      while proc.isalive():
                          data = proc.read(4096)
                          if data:
                              chunks.append(data)
                  except (EOFError, OSError):
                      pass

              thread = threading.Thread(target=reader, daemon=True)
              thread.start()
              deadline = time.time() + 8
              while proc.isalive() and time.time() < deadline:
                  time.sleep(0.2)
              alive = proc.isalive()
              if alive:
                  proc.terminate(force=True)
              thread.join(timeout=2)

              output = "".join(chunks)
              print(repr(output[:16000]))
              after = "[probe] after createCliRenderer" in output
              destroyed = "[probe] destroyed" in output
              print(f"RESULT {label}: after_create={after} destroyed={destroyed} alive_after_8s={alive}")
              return output, after, destroyed

          base = run_case("baseline", {})
          console = run_case("console-control", {"OT_USE_CONSOLE_CONTROL": "true"})
          safe = run_case("console-control-no-kitty", {
              "OT_USE_CONSOLE_CONTROL": "true",
              "OT_NO_SAFETY_KITTY_KEYBOARD": "1",
          })

          print("SUMMARY", {
              "baseline_after": base[1],
              "console_after": console[1],
              "safe_after": safe[1],
          })
          if not any(case[1] for case in (base, console, safe)):
              raise SystemExit("createCliRenderer hangs in every tested Windows terminal mode")
          '@ | Set-Content -Encoding UTF8 opentui_probe_runner.py
          python opentui_probe_runner.py

      - name: Interactive OpenCode TUI smoke in ConPTY
        shell: pwsh
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          OPENCODE_PURE: '1'
        run: |
          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          root = os.path.abspath(r"unpacked\windows-modern")
          bat = os.path.join(root, "opencode.bat")
          proc = PtyProcess.spawn(["cmd.exe", "/d", "/c", bat], cwd=root, dimensions=(120, 40))
          chunks = []

          def reader():
              try:
                  while proc.isalive():
                      data = proc.read(4096)
                      if data:
                          chunks.append(data)
              except (EOFError, OSError):
                  pass

          thread = threading.Thread(target=reader, daemon=True)
          thread.start()
          time.sleep(12)
          if proc.isalive():
              try:
                  proc.write("\x03")
              except Exception:
                  pass
              time.sleep(1)
          if proc.isalive():
              proc.terminate(force=True)
          thread.join(timeout=2)

          output = "".join(chunks)
          print(repr(output[:16000]))
          clean = re.sub(r"\x1b\][^\x07]*(?:\x07|\x1b\\)", "", output)
          clean = re.sub(r"\x1bP.*?\x1b\\", "", clean, flags=re.S)
          clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", clean)
          clean = "".join(ch for ch in clean if ch in "\r\n\t" or ord(ch) >= 32)
          printable = clean.strip()
          print(printable[:12000])
          print(f"printable chars={len(printable)}")
          if len(printable) < 80:
              raise SystemExit("interactive TUI produced too little terminal output; likely blank or hung")
          '@ | Set-Content -Encoding UTF8 opencode_tui_smoke.py
          python opencode_tui_smoke.py
