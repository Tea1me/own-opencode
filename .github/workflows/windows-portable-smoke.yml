name: Windows Portable Smoke

on:
  push:
    branches: [main]
    paths:
      - 'build/windows-modern-portable.sh'
      - '.github/workflows/windows-portable-smoke.yml'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget jq unzip

      - name: Resolve latest OpenCode release
        id: version
        shell: bash
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)
          test -n "$tag" && test "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using OpenCode $tag"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build Windows modern portable
        shell: bash
        run: |
          chmod +x build/windows-modern-portable.sh
          ./build/windows-modern-portable.sh '${{ steps.version.outputs.tag }}'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-modern-smoke
          path: dist/opencode-${{ steps.version.outputs.tag }}-portable-windows-modern-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-modern-smoke
          path: artifact

      - name: Extract portable
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw 'portable archive missing' }
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          tar -xzf $archive.FullName -C unpacked

      - name: Verify bundled runtime and CLI commands
        shell: pwsh
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          $bun = Join-Path $root 'runtime/bun/bun.exe'
          if (-not (Test-Path $bun)) { throw 'bundled bun.exe missing' }
          $v = & $bun --version
          if ($LASTEXITCODE -ne 0) { throw 'bun --version failed' }
          if ($v.Trim() -ne '1.3.14') { throw "expected Bun 1.3.14, got $v" }
          $bat = Get-Content (Join-Path $root 'opencode.bat') -Raw
          if ($bat -notmatch '--no-install') { throw 'launcher does not contain --no-install' }
          if ($bat -notmatch 'OPENCODE_DISABLE_AUTOUPDATE=1') { throw 'launcher does not disable OpenCode auto-update' }
          Push-Location $root
          try {
            cmd /d /c "opencode.bat --version"
            if ($LASTEXITCODE -ne 0) { throw "opencode --version failed with $LASTEXITCODE" }
            cmd /d /c "opencode.bat --help > smoke-help.txt 2>&1"
            if ($LASTEXITCODE -ne 0) { Get-Content smoke-help.txt; throw "opencode --help failed" }
          } finally { Pop-Location }

      - name: Download official Windows CLI for control test
        shell: pwsh
        run: |
          $tag = '${{ needs.build.outputs.tag }}'
          $url = "https://github.com/anomalyco/opencode/releases/download/$tag/opencode-windows-x64.zip"
          Write-Host "Downloading control: $url"
          curl.exe -fL --retry 3 -o official.zip $url
          New-Item -ItemType Directory -Force -Path official | Out-Null
          Expand-Archive -Path official.zip -DestinationPath official -Force
          Get-ChildItem official -Recurse | Select-Object FullName,Length
          $exe = Get-ChildItem official -Recurse -Filter opencode.exe | Select-Object -First 1
          if (-not $exe) { throw 'official opencode.exe missing' }
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'official --version failed' }

      - name: Install ConPTY test helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pywinpty

      - name: Compare official and portable TUI in identical ConPTY
        shell: pwsh
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          OPENCODE_PURE: '1'
        run: |
          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          workspace = os.getcwd()
          portable_root = os.path.abspath(r"unpacked\windows-modern")
          portable_bat = os.path.join(portable_root, "opencode.bat")

          official_candidates = []
          for base, _, files in os.walk(os.path.abspath("official")):
              for name in files:
                  if name.lower() == "opencode.exe":
                      official_candidates.append(os.path.join(base, name))
          if not official_candidates:
              raise SystemExit("official opencode.exe not found")
          official_exe = official_candidates[0]

          def clean_text(output):
              clean = re.sub(r"\x1b\][^\x07]*(?:\x07|\x1b\\)", "", output)
              clean = re.sub(r"\x1bP.*?\x1b\\", "", clean, flags=re.S)
              clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", clean)
              clean = "".join(ch for ch in clean if ch in "\r\n\t" or ord(ch) >= 32)
              return clean.strip()

          def run_case(label, argv, cwd):
              print(f"===== {label}: {argv!r} =====")
              proc = PtyProcess.spawn(argv, cwd=cwd, dimensions=(120, 40))
              chunks = []
              def reader():
                  try:
                      while proc.isalive():
                          data = proc.read(4096)
                          if data:
                              chunks.append(data)
                  except (EOFError, OSError):
                      pass
              t = threading.Thread(target=reader, daemon=True)
              t.start()
              time.sleep(12)
              alive = proc.isalive()
              if alive:
                  try:
                      proc.write("\x03")
                  except Exception:
                      pass
                  time.sleep(1)
              if proc.isalive():
                  proc.terminate(force=True)
              t.join(timeout=2)
              output = "".join(chunks)
              text = clean_text(output)
              print(f"----- {label} raw -----")
              print(repr(output[:16000]))
              print(f"----- {label} printable -----")
              print(text[:12000])
              print(f"RESULT {label}: printable={len(text)} alive_after_12s={alive}")
              return output, text

          portable = run_case("portable", ["cmd.exe", "/d", "/c", portable_bat], portable_root)
          official = run_case("official", [official_exe], os.path.dirname(official_exe))

          print(f"SUMMARY portable={len(portable[1])} official={len(official[1])}")
          if len(official[1]) < 80:
              raise SystemExit("official binary is also blank in CI ConPTY; ConPTY is not a valid render oracle")
          if len(portable[1]) < 80:
              raise SystemExit("official binary renders but portable TUI is blank")
          '@ | Set-Content -Encoding UTF8 tui_control_compare.py
          python tui_control_compare.py
