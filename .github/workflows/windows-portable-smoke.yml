name: Windows Portable Smoke

on:
  push:
    branches: [main]
    paths:
      - 'build/windows-modern-portable.sh'
      - '.github/workflows/windows-portable-smoke.yml'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget jq unzip

      - name: Resolve latest OpenCode release
        id: version
        shell: bash
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r .tag_name)
          test -n "$tag" && test "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using OpenCode $tag"

      - name: Build Windows compiled portable
        shell: bash
        run: |
          chmod +x build/windows-modern-portable.sh
          ./build/windows-modern-portable.sh '${{ steps.version.outputs.tag }}'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-modern-smoke
          path: dist/opencode-${{ steps.version.outputs.tag }}-portable-windows-modern-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-modern-smoke
          path: artifact

      - name: Extract
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifact -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw 'portable archive missing' }
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          tar -xzf $archive.FullName -C unpacked

      - name: Verify compiled engine and strict portable launcher
        shell: pwsh
        run: |
          $root = Resolve-Path 'unpacked/windows-modern'
          $exe = Join-Path $root 'bin/opencode.exe'
          $configFile = Join-Path $root 'portable-data/config/opencode/opencode.jsonc'
          if (-not (Test-Path $exe)) { throw 'bin/opencode.exe missing' }
          if (-not (Test-Path $configFile)) { throw 'package-local opencode.jsonc missing' }

          $expected = '${{ needs.build.outputs.tag }}'.TrimStart('v')
          $actual = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'compiled opencode --version failed' }
          if ($actual -ne $expected) { throw "expected $expected, got $actual" }

          $bat = Get-Content (Join-Path $root 'opencode.bat') -Raw
          if ($bat -match '(?im)^\s*cd\s+/d\s+') { throw 'launcher must not change caller working directory' }
          foreach ($needle in @(
            'HOME=%PORTABLE_HOME%',
            'USERPROFILE=%PORTABLE_HOME%',
            'APPDATA=%PORTABLE_HOME%\AppData\Roaming',
            'LOCALAPPDATA=%PORTABLE_HOME%\AppData\Local',
            'XDG_CONFIG_HOME=%CONFIG_HOME%',
            'XDG_DATA_HOME=%DATA_HOME%',
            'XDG_CACHE_HOME=%CACHE_HOME%',
            'XDG_STATE_HOME=%STATE_HOME%',
            'XDG_RUNTIME_DIR=%TMP_HOME%',
            'OPENCODE_CONFIG_DIR=%CONFIG_DIR%',
            'OPENCODE_DB=%DATA_HOME%\opencode\opencode.db',
            'TEMP=%TMP_HOME%',
            'TMP=%TMP_HOME%',
            'OPENCODE_DISABLE_AUTOUPDATE=1',
            'bin\opencode.exe'
          )) {
            if ($bat -notmatch [regex]::Escape($needle)) { throw "launcher missing: $needle" }
          }

      - name: Verify package-local config and paths from an external project cwd
        shell: pwsh
        run: |
          $root = (Resolve-Path 'unpacked/windows-modern').Path
          $bat = Join-Path $root 'opencode.bat'
          $portable = Join-Path $root 'portable-data'
          $configFile = Join-Path $portable 'config\opencode\opencode.jsonc'
          $project = Join-Path $PWD 'project-smoke'
          New-Item -ItemType Directory -Force -Path $project | Out-Null

          @'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "portable/sentinel-model"
          }
          '@ | Set-Content -Encoding UTF8 $configFile

          $hostHome = $env:USERPROFILE
          $hostConfig = Join-Path $hostHome '.config\opencode'
          $hostConfigExisted = Test-Path $hostConfig

          Push-Location $project
          try {
            cmd /d /c "`"$bat`" --version"
            if ($LASTEXITCODE -ne 0) { throw "opencode --version failed: $LASTEXITCODE" }

            cmd /d /c "`"$bat`" --help > smoke-help.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-help.txt
              throw "opencode --help failed: $LASTEXITCODE"
            }

            cmd /d /c "`"$bat`" debug paths > smoke-paths.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-paths.txt
              throw "opencode debug paths failed: $LASTEXITCODE"
            }
            $paths = Get-Content smoke-paths.txt -Raw
            Write-Host $paths

            $expected = @{
              home   = (Join-Path $portable 'home')
              config = (Join-Path $portable 'config\opencode')
              data   = (Join-Path $portable 'data\opencode')
              cache  = (Join-Path $portable 'cache\opencode')
              state  = (Join-Path $portable 'state\opencode')
              tmp    = (Join-Path $portable 'tmp\opencode')
            }
            foreach ($entry in $expected.GetEnumerator()) {
              if ($paths -notlike "*$($entry.Value)*") {
                throw "debug paths did not report portable $($entry.Key) path: $($entry.Value)"
              }
            }

            cmd /d /c "`"$bat`" debug config > smoke-config.txt 2>&1"
            if ($LASTEXITCODE -ne 0) {
              Get-Content smoke-config.txt
              throw "opencode debug config failed: $LASTEXITCODE"
            }
            $resolved = Get-Content smoke-config.txt -Raw
            if ($resolved -notlike '*portable/sentinel-model*') {
              Write-Host $resolved
              throw 'package-local opencode.jsonc was not loaded'
            }
          }
          finally {
            Pop-Location
          }

          if (-not $hostConfigExisted -and (Test-Path $hostConfig)) {
            throw "OpenCode leaked a config directory into host home: $hostConfig"
          }

      - name: Install ConPTY test helper
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pywinpty

      - name: Interactive TUI must render from an external project cwd
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import os
          import re
          import threading
          import time
          from winpty import PtyProcess

          root = os.path.abspath(r"unpacked\windows-modern")
          project = os.path.abspath(r"project-smoke")
          bat = os.path.join(root, "opencode.bat")
          proc = PtyProcess.spawn(["cmd.exe", "/d", "/c", bat], cwd=project, dimensions=(120, 40))
          chunks = []

          def reader():
              try:
                  while proc.isalive():
                      data = proc.read(4096)
                      if data:
                          chunks.append(data)
              except (EOFError, OSError):
                  pass

          thread = threading.Thread(target=reader, daemon=True)
          thread.start()
          time.sleep(12)
          alive = proc.isalive()
          if alive:
              try:
                  proc.write("\x03")
              except Exception:
                  pass
              time.sleep(1)
          if proc.isalive():
              proc.terminate(force=True)
          thread.join(timeout=2)

          output = "".join(chunks)
          clean = re.sub(r"\x1b\][^\x07]*(?:\x07|\x1b\\)", "", output)
          clean = re.sub(r"\x1bP.*?\x1b\\", "", clean, flags=re.S)
          clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", clean)
          clean = "".join(ch for ch in clean if ch in "\r\n\t" or ord(ch) >= 32)
          printable = clean.strip()
          print(repr(output[:16000]))
          print(printable[:12000])
          print(f"printable chars={len(printable)} alive_after_12s={alive}")

          lower = output.lower()
          for marker in ("module not found", "cannot find module", "unexpected error", "syntaxerror", "referenceerror"):
              if marker in lower:
                  raise SystemExit(f"TUI emitted fatal marker: {marker}")
          if len(printable) < 80:
              raise SystemExit("interactive TUI did not render enough printable terminal content")
          '@ | Set-Content -Encoding UTF8 tui_smoke.py
          python tui_smoke.py
